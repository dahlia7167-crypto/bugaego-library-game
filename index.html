<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부개고 다독다독 도서관: 명예의 전당</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 20px; }
        #hall-of-fame { background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin: 20px auto; width: 90%; max-width: 700px; box-sizing: border-box; }

        .confetti { font-size: 45px; margin-bottom: 15px; }
        
        .main-title { font-size: 26px; color: #2c3e50; margin-bottom: 15px; line-height: 1.4; word-break: keep-all; font-weight: 900; }
        .main-title span { color: #27ae60; }
        
        .sub-title { font-size: 18px; color: #e74c3c; margin-bottom: 35px; font-weight: bold; line-height: 1.5; word-break: keep-all; }

        .ranking-table { width: 100%; border-collapse: collapse; }
        .ranking-table th, .ranking-table td { padding: 15px; border-bottom: 1px solid #eee; font-size: 18px; word-break: keep-all; }
        .ranking-table th { background-color: #fdfdfd; color: #333; font-weight: 900; }
        
        /* 💡 1, 2, 3등 특별 강조 디자인 */
        .ranking-table tr:nth-child(1) td { color: #d35400; font-weight: 900; font-size: 22px; background-color: #fff9f0; } 
        .ranking-table tr:nth-child(2) td { color: #e67e22; font-weight: 900; font-size: 20px; background-color: #fffcf5; } 
        .ranking-table tr:nth-child(3) td { color: #f39c12; font-weight: 900; font-size: 20px; background-color: #fffdf9; } 

        .footer-note { margin-top: 35px; font-size: 15px; color: #7f8c8d; font-weight: bold; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            #hall-of-fame { width: 100%; padding: 30px 15px; margin: 10px auto; }
            .confetti { font-size: 35px; }
            .main-title { font-size: 22px; margin-bottom: 10px; }
            .sub-title { font-size: 15px; margin-bottom: 25px; }
            .ranking-table th, .ranking-table td { padding: 12px; font-size: 15px; }
            .ranking-table tr:nth-child(1) td { font-size: 18px; }
            .ranking-table tr:nth-child(2) td { font-size: 16px; }
            .ranking-table tr:nth-child(3) td { font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="hall-of-fame">
    <div class="confetti">🎉🏆🎉</div>
    <div class="main-title">🏫부개고 <span>다독다독 도서관</span><br>청구기호 정렬 게임 종료</div>
    <div class="sub-title">치열했던 서가 정렬 랭킹전이 모두 마감되었습니다.<br>명예의 전당에 등극하신 학생들을 진심으로 축하합니다! 🎁</div>

    <table class="ranking-table">
        <thead>
            <tr>
                <th>순위</th>
                <th>학번&이름</th>
                <th>최종 점수</th>
            </tr>
        </thead>
        <tbody id="ranking-list">
            <tr><td colspan="3" style="color: #7f8c8d;">실시간 랭킹 데이터를 불러오는 중입니다... ⏳</td></tr>
        </tbody>
    </table>
    
    <div class="footer-note">
        ※ 간식 꾸러미 및 상품 수령 안내는 별도로 공지될 예정입니다. 참여해 주신 모든 학생 여러분 감사합니다! 😊
    </div>
