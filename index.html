<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부개고 다독다독 도서관: 청구기호 게임 랭킹전</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 20px; }
        #game-board, #ranking-screen { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin: 20px auto; width: 90%; max-width: 700px; box-sizing: border-box; }
        #ranking-screen { display: none; }
        
        .main-title { font-size: 22px; color: #2c3e50; margin-bottom: 25px; line-height: 1.4; word-break: keep-all; font-weight: 900; }
        .main-title span { color: #27ae60; }
        
        .shelf { background-color: #d4a373; height: 15px; width: 100%; border-radius: 3px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); margin-bottom: 40px; }
        .books-container { display: flex; justify-content: center; align-items: flex-end; gap: 6px; height: 260px; padding: 0 20px; }
        
        .book { width: 70px; height: 240px; border-radius: 4px 2px 2px 4px; cursor: grab; user-select: none; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 25px; box-shadow: -3px 0 5px rgba(0,0,0,0.1) inset, 3px 3px 8px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .book:hover { transform: translateY(-10px); }
        .book:active { cursor: grabbing; opacity: 0.9; }
        .book::before { content: ''; position: absolute; top: 15px; left: 5px; right: 5px; height: 3px; background: rgba(0,0,0,0.1); }
        .book::after { content: ''; position: absolute; bottom: 85px; left: 5px; right: 5px; height: 3px; background: rgba(0,0,0,0.1); }

        .call-label { background-color: #fdfdfd; color: #333; width: 50px; padding: 8px 4px; font-size: 13px; font-weight: 900; text-align: center; border-radius: 2px; box-shadow: 1px 1px 3px rgba(0,0,0,0.1); word-break: break-all; line-height: 1.4; border: 1px solid #eee; }
        
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #2c3e50; color: white; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: 0.2s; }
        button:hover { background-color: #1a252f; transform: translateY(-2px); }
        
        .stats { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #555; background-color: #f8f9fa; padding: 10px 20px; border-radius: 8px; }
        .ranking-table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        .ranking-table th, .ranking-table td { padding: 12px; border-bottom: 1px solid #eee; font-size: 16px; word-break: keep-all; }
        .ranking-table th { background-color: #fdfdfd; color: #333; }
        input[type="text"] { padding: 10px; font-size: 16px; width: 220px; border-radius: 5px; border: 1px solid #ccc; margin-right: 10px; text-align: center; outline: none; }
        input[type="text"]:focus { border-color: #27ae60; }
        
        /* 💡 내 순위 강조 디자인 */
        #my-rank-display { display: none; background-color: #e8f8f5; color: #117a65; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: 900; margin-top: 20px; border: 2px solid #a3e4d7; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            #game-board, #ranking-screen { width: 100%; padding: 15px; margin: 10px auto; }
            .main-title { font-size: 18px; margin-bottom: 15px; }
            .books-container { padding: 0 2px; gap: 4px; height: 200px; }
            .book { width: 45px !important; height: 180px !important; padding-bottom: 15px; }
            .call-label { width: 36px; font-size: 11px; padding: 4px 2px; }
            .stats { font-size: 14px; padding: 8px 15px; }
            button { padding: 10px 16px; font-size: 14px; }
            input[type="text"] { width: 180px; margin-bottom: 10px; }
            #my-rank-display { font-size: 18px; padding: 10px; }
        }
    </style>
</head>
<body>

<div id="game-board">
    <div class="main-title">🏫부개고 <span>다독다독 도서관📖</span><br>🎮청구기호 정렬 게임 랭킹전🏆</div>
    
    <div class="stats">
        <div>점수: <span id="score-display">0</span>점</div>
        <div>스테이지: <span id="stage-level">1</span></div>
    </div>
    <p style="font-weight: bold; color: #444; margin-bottom: 20px;">청구기호를 가나다/숫자순으로 바르게 정렬하세요!<br><span style="color:#e74c3c; font-size:14px;">(빠를수록 보너스 점수가 올라갑니다!)</span></p>
    
    <div class="books-container" id="books-container"></div>
    <div class="shelf"></div>
    
    <button onclick="checkAnswer()">정답 제출하기</button>
</div>

<div id="ranking-screen">
    <div class="main-title">🏫 부개고 <span>다독다독 도서관</span><br>청구기호 정렬 게임 랭킹전 🏆</div>
    
    <h2 style="color: #e74c3c;">🎮 GAME OVER 🎮</h2>
    <p style="font-size: 18px; font-weight: bold;">최종 점수: <span id="final-score">0</span>점</p>
    
    <div id="register-area" style="margin: 20px 0;">
        <input type="text" id="player-name" placeholder="예: 10101 김다독" maxlength="15">
        <button onclick="submitScore()" style="background-color: #27ae60;">랭킹 등록</button>
    </div>

    <!-- 💡 내 순위가 표시될 영역 -->
    <div id="my-rank-display">🎉 <span id="player-name-display"></span> 학생의 순위: <span id="my-rank-value"></span>등! 🎉</div>

    <h3 style="margin-top: 30px;">🏆 실시간 명예의 전당 (Top 10)</h3>
    <table class="ranking-table">
        <thead>
            <tr>
                <th>순위</th>
                <th>학번&이름</th>
                <th>점수</th>
            </tr>
        </thead>
        <tbody id="ranking-list">
        </tbody>
    </table>
    <br>
    <button onclick="restartGame()" style="margin-top: 10px;">다시 도전하기</button>
</div>

<script>
    let db = null;
    
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyC18DP2CRzAw0opE91vYCCiNkNhPRI7Pes",
            authDomain: "bugaego-library.firebaseapp.com",
            projectId: "bugaego-library",
            storageBucket: "bugaego-library.firebasestorage.app",
            messagingSenderId: "105126106146",
            appId: "1:105126106146:web:0b33137e0e8e2a611aa67b"
        };
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch (error) {
        console.warn("서버 연결 지연. 로컬 모드로 작동합니다.", error);
    }

    let currentStage = 1;
    let score = 0;
    let currentCorrectAnswer = [];
    let stageStartTime = 0; // 💡 스테이지 시작 시간 기록용 변수
    
    const bookColors = [
        "linear-gradient(to right, #ffb3ba, #ff9ab3)", 
        "linear-gradient(to right, #ffdfba, #ffc894)", 
        "linear-gradient(to right, #ffffba, #e8e898)", 
        "linear-gradient(to right, #baffc9, #95e6a8)", 
        "linear-gradient(to right, #bae1ff, #94ccf9)", 
        "linear-gradient(to right, #e2cbff, #c9a7f9)"  
    ];

    function generateCallNumbers(count) {
        const classes = ["001", "001.3", "013.41", "026", "029", "029.8", "031", "040", "069.04", "069.0911", "082", "104", "114.5", "126", "126.5", "152.222", "152.7", "181.3", "189.1", "220", "223.84", "224.2", "301.0911", "304", "309.11", "309.111", "309.1666", "320.189", "320.4", "320.9", "325.04", "325.1", "325.21", "325.211", "326.18", "326.184", "331.5", "331.54", "370", "372.68", "381.30911", "381.75", "404", "408", "409", "409.9", "410", "430.9", "440.9", "442.6", "442.63", "495.8", "496.01", "496.1", "511.1813", "511.4", "511.404", "517.1", "517.5", "517.523", "539.73", "539.9", "594.019", "594.5", "600", "600.13", "600.4", "600.99", "610.4", "610.911", "634", "657.1", "657.109", "670.92", "670.99", "701", "701.01", "701.109", "711.2", "711.25", "711.4", "714.7", "715", "715.03", "744", "745", "802", "808", "808.9", "810.9", "810.906", "811.6", "811.609", "813.6", "814.6", "814.709", "816.6", "818", "823", "833.6", "843", "848", "863", "900", "910", "911.03", "911.057", "921.05", "921.07", "922", "930", "942.048", "942.073", "980.1", "980.22", "990.94", "998.4"];
        const names = ["강", "고", "김", "나", "도", "류", "마", "문", "박", "방", "백", "부", "변", "선", "소", "신", "안", "연", "오", "우", "유", "윤", "이", "임", "장", "전", "정", "조", "주", "차", "청", "추", "칸", "태", "표", "한", "황"];
        const consonants = ["ㄱ", "ㄴ", "ㄷ", "ㄹ", "ㅁ", "ㅂ", "ㅅ", "ㅇ", "ㅈ", "ㅎ"];
        
        let numbers = [];
        for (let i = 0; i < count; i++) {
            let cls = classes[Math.floor(Math.random() * classes.length)];
            let name = names[Math.floor(Math.random() * names.length)];
            let num = Math.floor(Math.random() * 90) + 10;
            let cons = consonants[Math.floor(Math.random() * consonants.length)];
            numbers.push(`${cls} ${name}${num}${cons}`);
        }
        return [...new Set(numbers)].length === count ? numbers : generateCallNumbers(count);
    }

    function sortCallNumbers(numbers) {
        return [...numbers].sort((a, b) => {
            let partsA = a.split(" "); let partsB = b.split(" ");
            let classA = parseFloat(partsA[0]); let classB = parseFloat(partsB[0]);
            if (classA !== classB) return classA - classB;
            return partsA[1].localeCompare(partsB[1]);
        });
    }

    function loadStage() {
        const container = document.getElementById("books-container");
        container.innerHTML = "";
        document.getElementById("stage-level").innerText = currentStage;
        document.getElementById("score-display").innerText = score;

        let minBooks, maxBooks;
        if (currentStage <= 5) { minBooks = 2; maxBooks = 3; } 
        else if (currentStage <= 10) { minBooks = 3; maxBooks = 4; } 
        else if (currentStage <= 15) { minBooks = 4; maxBooks = 5; } 
        else { minBooks = 5; maxBooks = 6; }
        
        let bookCount = Math.floor(Math.random() * (maxBooks - minBooks + 1)) + minBooks;
        let rawCallNumbers = generateCallNumbers(bookCount);
        currentCorrectAnswer = sortCallNumbers(rawCallNumbers);

        let shuffledNumbers = [...rawCallNumbers].sort(() => Math.random() - 0.5);
        while (JSON.stringify(shuffledNumbers) === JSON.stringify(currentCorrectAnswer)) {
            shuffledNumbers.sort(() => Math.random() - 0.5);
        }

        shuffledNumbers.forEach(number => {
            const book = document.createElement("div");
            book.className = "book";
            book.draggable = true;
            book.style.background = bookColors[Math.floor(Math.random() * bookColors.length)];
            book.style.height = `${Math.floor(Math.random() * 30) + 220}px`;

            const label = document.createElement("div");
            label.className = "call-label";
            label.innerHTML = number.split(" ").join("<br>"); 
            
            book.appendChild(label);
            book.addEventListener("dragstart", function() { draggedBook = this; });
            book.addEventListener("dragover", function(e) { e.preventDefault(); });
            book.addEventListener("drop", handleDrop);
            book.dataset.callNumber = number;
            container.appendChild(book);
        });
        
        // 💡 스테이지 세팅이 끝나면 타이머 시작!
        stageStartTime = Date.now();
    }

    let draggedBook = null;
    function handleDrop(e) {
        e.preventDefault();
        if (this !== draggedBook) {
            let allBooks = Array.from(document.querySelectorAll('.book'));
            let draggedIndex = allBooks.indexOf(draggedBook);
            let droppedIndex = allBooks.indexOf(this);
            if (draggedIndex < droppedIndex) this.parentNode.insertBefore(draggedBook, this.nextSibling);
            else this.parentNode.insertBefore(draggedBook, this);
        }
    }

    function checkAnswer() {
        const currentBooks = Array.from(document.querySelectorAll('.book')).map(book => book.dataset.callNumber);
        const isCorrect = currentBooks.every((val, index) => val === currentCorrectAnswer[index]);

        if (isCorrect) {
            // 💡 스피드 보너스 점수 계산 (빨리 풀수록 높은 점수)
            let endTime = Date.now();
            let timeTaken = (endTime - stageStartTime) / 1000; // 걸린 시간(초)
            let timeBonus = Math.max(0, 100 - Math.floor(timeTaken * 3)); // 1초 지날 때마다 보너스 3점씩 감소
            let stageScore = 100 + timeBonus; // 기본 100점 + 시간 보너스
            
            score += stageScore; 
            currentStage++;
            alert(`정답입니다! 🚀\n(기본 100점 + 시간 보너스 ${timeBonus}점)`); 
            loadStage();
        } else {
            alert(`틀렸습니다! 😢 최종 점수: ${score}점`);
            gameOver();
        }
    }

    function gameOver() {
        document.getElementById("game-board").style.display = "none";
        document.getElementById("ranking-screen").style.display = "block";
        document.getElementById("final-score").innerText = score;
        document.getElementById("register-area").style.display = "block";
        document.getElementById("my-rank-display").style.display = "none"; // 순위창 초기화
        loadRankings();
    }

    function submitScore() {
        const name = document.getElementById("player-name").value.trim();
        if (!name) { alert("[학번&이름]을 입력해주세요!"); return; }
        
        if (!db) {
            alert("서버 접속이 원활하지 않아 일단 로컬 화면에만 표시할게!");
            addLocalRow(name, score);
            document.getElementById("register-area").style.display = "none";
            return;
        }

        // 서버에 점수 저장하기
        db.collection("rankings").add({
            name: name,
            score: score,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("랭킹 등록 완료!");
            document.getElementById("register-area").style.display = "none";
            
            // 💡 내 등수 계산하기 (나보다 점수가 높은 사람 수를 세서 +1)
            db.collection("rankings").where("score", ">", score).get()
            .then((snapshot) => {
                let myRank = snapshot.size + 1; // 나보다 잘한 사람 수 + 1이 내 등수
                document.getElementById("player-name-display").innerText = name;
                document.getElementById("my-rank-value").innerText = myRank;
                document.getElementById("my-rank-display").style.display = "block"; // 순위 띄우기
            });

            loadRankings(); // 전체 랭킹 새로고침
        }).catch(err => {
            console.error("저장 에러: ", err);
            alert("앗, 데이터 저장 중 오류가 발생했어!");
        });
    }

    function loadRankings() {
        const listContainer = document.getElementById("ranking-list");
        listContainer.innerHTML = "";

        if (!db) return;

        db.collection("rankings")
          .orderBy("score", "desc")
          .limit(10)
          .get()
          .then((querySnapshot) => {
              let rank = 1;
              querySnapshot.forEach((doc) => {
                  const data = doc.data();
                  const row = `<tr><td>${rank++}</td><td>${data.name}</td><td>${data.score}</td></tr>`;
                  listContainer.innerHTML += row;
              });
          })
          .catch(err => {
              console.error("불러오기 에러: ", err);
              listContainer.innerHTML = "<tr><td colspan='3'>랭킹을 불러오지 못했어요.</td></tr>";
          });
    }

    function addLocalRow(name, score) {
        const listContainer = document.getElementById("ranking-list");
        listContainer.innerHTML = `<tr><td>-</td><td>${name}</td><td>${score}</td></tr>` + listContainer.innerHTML;
    }

    function restartGame() {
        currentStage = 1; score = 0;
        document.getElementById("game-board").style.display = "block";
        document.getElementById("ranking-screen").style.display = "none";
        document.getElementById("player-name").value = "";
        loadStage();
    }

    loadStage();
</script>

</body>
</html>
